<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Universo Zero - Protótipo de Gênese Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', monospace; }
    body { background-color: #050508; color: #e0e6ed; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

    #era-bar {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
      background: rgba(10, 14, 24, 0.92); border: 1px solid #1e293b;
      padding: 5px 10px; border-radius: 20px; display: flex; gap: 5px;
      align-items: center; backdrop-filter: blur(6px); font-size: 11px;
    }
    .era-label { color: #64748b; font-weight: bold; }
    .era-link { text-decoration: none; color: #94a3b8; padding: 3px 8px; border-radius: 12px; }
    .era-link:hover { color: #f8fafc; background: #1e293b; }
    .era-link.active { color: #38bdf8; background: rgba(56, 189, 248, 0.12); border: 1px solid #0284c7; font-weight: bold; }
    
    #hud {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(12, 15, 24, 0.85); border: 1px solid #1f293a;
      padding: 15px; border-radius: 8px; width: 310px; backdrop-filter: blur(5px);
    }
    h1 { font-size: 16px; color: #38bdf8; margin-bottom: 5px; letter-spacing: 1px; }
    p.sub { font-size: 11px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4; }
    
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; font-size: 12px; }
    .stat-box { background: #0f1420; padding: 6px 8px; border-radius: 4px; border: 1px solid #1e293b; }
    .stat-val { font-size: 15px; font-weight: bold; color: #f8fafc; }

    .controls { display: flex; flex-direction: column; gap: 8px; font-size: 11px; }
    label { display: flex; justify-content: space-between; color: #cbd5e1; }
    input[type=range] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

    .btns { display: flex; gap: 6px; margin-top: 10px; }
    button {
      flex: 1; padding: 7px; border: none; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: bold; transition: 0.2s;
    }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger { background: #be123c; color: white; }
    .btn-danger:hover { background: #9f1239; }
    .btn-export { background: #059669; color: white; }
    .btn-export:hover { background: #047857; }

    #log {
      position: absolute; bottom: 15px; left: 15px; z-index: 10;
      background: rgba(12, 15, 24, 0.75); border: 1px solid #1f293a;
      padding: 10px; border-radius: 6px; width: 310px; max-height: 130px;
      overflow-y: auto; font-size: 11px; color: #94a3b8;
    }
    .log-entry { margin-bottom: 4px; border-bottom: 1px solid #161e2e; padding-bottom: 2px; }
    .highlight { color: #34d399; }

    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  </style>
</head>
<body>

  <div id="era-bar">
    <span class="era-label">ERAS:</span>
    <a href="fase1.html" class="era-link active">Era 1</a>
    <a href="fase2.html" class="era-link">Era 2</a>
    <a href="fase3.html" class="era-link">Era 3</a>
    <a href="fase4.html" class="era-link">Era 4</a>
    <a href="fase5.html" class="era-link">Era 5</a>
    <a href="fase6.html" class="era-link">Era 6</a>
    <a href="fase7.html" class="era-link">Era 7</a>
    <a href="fase8.html" class="era-link">Era 8</a>
  </div>

  <div id="hud">
    <h1>UNIVERSO ZERO // FASE 1</h1>
    <p class="sub">Clique no vazio para injetar sementes de dados (0 e 1). Observe atração, repulsão, cópia e mutação.</p>
    
    <div class="stats">
      <div class="stat-box">Tempo (Ciclos)<div class="stat-val" id="stat-time">0</div></div>
      <div class="stat-box">Entidades<div class="stat-val" id="stat-pop">0</div></div>
      <div class="stat-box">Gerações<div class="stat-val" id="stat-gen">0</div></div>
      <div class="stat-box">Mutações<div class="stat-val" id="stat-mut">0</div></div>
    </div>

    <div class="controls">
      <div>
        <label>Taxa de Mutação: <span id="val-mut">10%</span></label>
        <input type="range" id="ctrl-mut" min="0" max="50" value="10">
      </div>
      <div>
        <label>Energia do Ambiente: <span id="val-eng">Média</span></label>
        <input type="range" id="ctrl-eng" min="1" max="10" value="5">
      </div>
    </div>

    <div class="btns">
      <button class="btn-primary" id="btn-bigbang">Simular Big Bang</button>
      <button class="btn-danger" id="btn-reset">Zerar (Vazio)</button>
      <button class="btn-export" id="btn-save-firebase" style="width: 100%;">☁️ Salvar na Nuvem (Firebase)</button>
    </div>
  </div>

  <div id="log">
    <div class="log-entry">Sistema iniciado. Aguardando injeção de dados...</div>
  </div>

  <canvas id="universe"></canvas>

<script>
  const canvas = document.getElementById('universe');
  const ctx = canvas.getContext('2d');
  let width, height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let entities = [];
  let nutrients = [];
  let cycles = 0;
  let maxGen = 0;
  let totalMutations = 0;
  const MAX_POPULATION = 350;

  const ctrlMut = document.getElementById('ctrl-mut');
  const ctrlEng = document.getElementById('ctrl-eng');
  ctrlMut.oninput = () => document.getElementById('val-mut').innerText = ctrlMut.value + '%';
  ctrlEng.oninput = () => {
    const v = ctrlEng.value;
    document.getElementById('val-eng').innerText = v < 4 ? 'Escassa' : v < 8 ? 'Média' : 'Abundante';
  };

  function addLog(msg, highlight = false) {
    const log = document.getElementById('log');
    const div = document.createElement('div');
    div.className = 'log-entry' + (highlight ? ' highlight' : '');
    div.innerText = '[Ciclo ' + cycles + '] ' + msg;
    log.prepend(div);
    if (log.children.length > 20) log.lastChild.remove();
  }

  class Entity {
    constructor(x, y, dna = null, gen = 1) {
      this.x = x;
      this.y = y;
      this.vx = (Math.random() - 0.5) * 2;
      this.vy = (Math.random() - 0.5) * 2;
      this.gen = gen;
      if (gen > maxGen) maxGen = gen;

      // DNA binário de 4 bits:
      // [0]: Polaridade (0 = atrai semelhantes, 1 = repele semelhantes)
      // [1]: Metabolismo (0 = lento/econômico, 1 = rápido/gastador)
      // [2]: Sociabilidade (0 = forma ligações/vínculos, 1 = solitário)
      // [3]: Afinidade (0 = carga azul/índigo, 1 = carga âmbar/rosa)
      this.dna = dna || [
        Math.round(Math.random()),
        Math.round(Math.random()),
        Math.round(Math.random()),
        Math.round(Math.random())
      ];

      this.energy = 60;
      this.radius = this.dna[1] === 0 ? 4.5 : 3.5;
      this.speed = this.dna[1] === 0 ? 1.2 : 2.3;
      this.color = this.dna[3] === 0 
        ? (this.dna[0] === 0 ? '#38bdf8' : '#818cf8') 
        : (this.dna[0] === 0 ? '#fbbf24' : '#f472b6');
    }

    mutateDNA() {
      const rate = parseInt(ctrlMut.value) / 100;
      let mutated = false;
      const newDna = this.dna.map(bit => {
        if (Math.random() < rate) {
          mutated = true;
          return bit === 0 ? 1 : 0;
        }
        return bit;
      });
      if (mutated) {
        totalMutations++;
        if (totalMutations % 15 === 0) {
          addLog('Mutação evolutiva! Novo código: [' + newDna.join('') + '] (Geração ' + (this.gen + 1) + ')', true);
        }
      }
      return newDna;
    }

    update() {
      this.energy -= this.dna[1] === 0 ? 0.08 : 0.16;

      for (let other of entities) {
        if (other === this) continue;
        const dx = other.x - this.x;
        const dy = other.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0 && dist < 90) {
          const sameType = this.dna[3] === other.dna[3];
          let force = 0;

          if (this.dna[0] === 0) {
            force = sameType ? 0.03 : -0.02;
          } else {
            force = sameType ? -0.03 : 0.04;
          }

          if (dist < 12) force = -0.15;

          this.vx += (dx / dist) * force;
          this.vy += (dy / dist) * force;

          if (this.dna[2] === 0 && other.dna[2] === 0 && dist < 45) {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(other.x, other.y);
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.22)';
            ctx.lineWidth = 1;
            ctx.stroke();
            this.energy += 0.025;
          }
        }
      }

      for (let i = nutrients.length - 1; i >= 0; i--) {
        const n = nutrients[i];
        const dx = n.x - this.x;
        const dy = n.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 70) {
          this.vx += (dx / dist) * 0.08;
          this.vy += (dy / dist) * 0.08;
        }
        if (dist < this.radius + 4) {
          this.energy += 35;
          nutrients.splice(i, 1);
        }
      }

      const vel = Math.hypot(this.vx, this.vy);
      if (vel > this.speed) {
        this.vx = (this.vx / vel) * this.speed;
        this.vy = (this.vy / vel) * this.speed;
      }

      this.x += this.vx;
      this.y += this.vy;

      if (this.x < 0) this.x = width;
      if (this.x > width) this.x = 0;
      if (this.y < 0) this.y = height;
      if (this.y > height) this.y = 0;

      if (this.energy >= 120 && entities.length < MAX_POPULATION) {
        this.energy = 55;
        const childDna = this.mutateDNA();
        entities.push(new Entity(this.x + 6, this.y + 6, childDna, this.gen + 1));
      }
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.fill();

      if (this.energy > 90) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2);
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = 0.3;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  canvas.addEventListener('mousedown', (e) => {
    for (let i = 0; i < 6; i++) {
      const offsetX = (Math.random() - 0.5) * 30;
      const offsetY = (Math.random() - 0.5) * 30;
      entities.push(new Entity(e.clientX + offsetX, e.clientY + offsetY));
    }
    addLog('Pulso de 6 sementes binárias injetado no espaço.');
  });

  function bigBang() {
    const cx = width / 2;
    const cy = height / 2;
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 60;
      const ent = new Entity(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist);
      ent.vx = Math.cos(angle) * 3;
      ent.vy = Math.sin(angle) * 3;
      entities.push(ent);
    }
    addLog('BIG BANG! 40 entidades primordiais liberadas.', true);
  }

  function resetUniverse() {
    entities = [];
    nutrients = [];
    cycles = 0;
    maxGen = 0;
    totalMutations = 0;
    addLog('Universo colapsado de volta ao vazio absoluto.');
  }

  document.getElementById('btn-bigbang').addEventListener('click', bigBang);
  document.getElementById('btn-reset').addEventListener('click', resetUniverse);
  document.getElementById('btn-save-firebase').addEventListener('click', async () => {
    const apelido = prompt("Digite seu nome ou apelido de pesquisador:", "Explorador_01");
    if (!apelido) return;
    sessionStorage.setItem("pesquisador", apelido);
    if (typeof window.gerarDadosExportacao === "function" && typeof window.enviarSimulacaoFirebase === "function") {
      await window.enviarSimulacaoFirebase(window.gerarDadosExportacao(), apelido);
    } else {
      alert("A integração Firebase ainda está carregando. Tente novamente em alguns segundos.");
    }
  });

  function loop() {
    ctx.fillStyle = 'rgba(5, 5, 8, 0.35)';
    ctx.fillRect(0, 0, width, height);

    if (entities.length > 0) cycles++;

    const energyRate = parseInt(ctrlEng.value);
    if (Math.random() < energyRate * 0.04 && nutrients.length < 120) {
      nutrients.push({ x: Math.random() * width, y: Math.random() * height });
    }

    ctx.fillStyle = '#10b981';
    for (let n of nutrients) {
      ctx.fillRect(n.x, n.y, 2, 2);
    }

    for (let i = entities.length - 1; i >= 0; i--) {
      const ent = entities[i];
      ent.update();
      ent.draw();
      if (ent.energy <= 0) {
        if (Math.random() < 0.5) nutrients.push({ x: ent.x, y: ent.y });
        entities.splice(i, 1);
      }
    }

    document.getElementById('stat-time').innerText = cycles;
    document.getElementById('stat-pop').innerText = entities.length;
    document.getElementById('stat-gen').innerText = maxGen;
    document.getElementById('stat-mut').innerText = totalMutations;

    requestAnimationFrame(loop);
  }

  loop();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // 1. COLE SUAS CHAVES DO FIREBASE AQUI:
  const firebaseConfig = {
  apiKey: "AIzaSyDWksdHygRbBNn---JMFSEB1GTmQJFEGTc",
  authDomain: "codigosuniverso-6cab3.firebaseapp.com",
  projectId: "codigosuniverso-6cab3",
  storageBucket: "codigosuniverso-6cab3.firebasestorage.app",
  messagingSenderId: "944884695734",
  appId: "1:944884695734:web:b125789cd27b3caf031c17",
  measurementId: "G-WM2RT7L9VZ"
  };

  // Inicializa o Firebase e o Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let ultimoCicloAutoSave = 0;

  function capturarEstadoAtual() {
    const metricas = {};
    document.querySelectorAll('[id^="stat-"]').forEach(el => {
      metricas[el.id] = el.textContent.trim();
    });
    return {
      projeto: "Universo Zero",
      fase: location.pathname.split('/').pop(),
      timestamp: new Date().toISOString(),
      metricas
    };
  }

  window.gerarDadosExportacao = capturarEstadoAtual;

  setInterval(async () => {
    const ciclos = Number(document.getElementById("stat-time")?.textContent || 0);
    if (ciclos >= 50000 && ciclos - ultimoCicloAutoSave >= 50000) {
      ultimoCicloAutoSave = ciclos;
      try {
        await addDoc(collection(db, "experimentos_multiverso"), {
          pesquisador: sessionStorage.getItem("pesquisador") || "AutoSave",
          tipo: "autosave",
          ciclo_limite: Math.floor(ciclos / 50000) * 50000,
          data_envio_servidor: serverTimestamp(),
          dados_experimento: capturarEstadoAtual()
        });
        console.log("Auto-save Firebase enviado no ciclo", ciclos);
      } catch (erro) {
        console.error("Falha no auto-save Firebase:", erro);
      }
    }
  }, 5000);

  // Função para capturar os dados atuais e enviar ao banco
  window.enviarSimulacaoFirebase = async function(dadosSimulacao, nomePesquisador = "Anonimo") {
    try {
      const payload = {
        pesquisador: nomePesquisador,
        data_envio_servidor: serverTimestamp(),
        dados_experimento: dadosSimulacao
      };

      const docRef = await addDoc(collection(db, "experimentos_multiverso"), payload);
      console.log("Experimento salvo com ID:", docRef.id);
      alert(`✅ Dados enviados com sucesso para o banco global!\nID do Registro: ${docRef.id}`);
    } catch (erro) {
      console.error("Erro ao enviar para o Firebase:", erro);
      alert("❌ Erro ao enviar dados. Verifique o console (F12) e suas chaves do Firebase.");
    }
  };

  // Cria o botão visual automaticamente na barra lateral (abaixo do botão de Exportar JSON)
  const criarBotaoNuvem = () => {
    const btnExportar = document.querySelector("button[id*='export'], button[onclick*='export'], .btn-export") 
      || Array.from(document.querySelectorAll("button")).find(b => b.textContent.includes("Exportar"));

    if (!document.getElementById("btn-save-firebase")) {
      const btnNuvem = document.createElement("button");
      btnNuvem.innerText = "☁️ Salvar na Nuvem (Firebase)";
      btnNuvem.style.cssText = "width: 100%; margin-top: 8px; padding: 8px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;";
      
      btnNuvem.onclick = async () => {
        const apelido = prompt("Digite seu nome ou apelido de pesquisador (para o ranking):", "Explorador_01");
        if (!apelido) return;

        // Dispara o mesmo objeto que você usa para gerar o JSON
        // Se a sua função de exportação tiver outro nome, basta chamar ela aqui:
        if (typeof gerarDadosExportacao === "function") {
          await window.enviarSimulacaoFirebase(gerarDadosExportacao(), apelido);
        } else {
          alert("⚠️ Conecte a variável de estado do seu JSON na função 'gerarDadosExportacao' dentro do script.");
        }
      };

      const container = btnExportar?.parentElement || document.querySelector(".btns") || document.querySelector("#hud") || document.body;
      container.appendChild(btnNuvem);
    }
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", criarBotaoNuvem, { once: true });
  } else {
    criarBotaoNuvem();
  }
</script>

</body>
